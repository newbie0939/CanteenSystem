<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Canteen Ordering System - Login</title>

    <link
        rel="stylesheet"
        href="assets/css/style.css"
    >

</head>

<body>

    <main class="login-container">

        <div class="login-header">

            <h1>
                Canteen Ordering System
            </h1>

            <p>
                Sign in to your account
            </p>

        </div>


        <form id="loginForm">

            <div class="form-group">

                <label for="login">
                    Student ID / Admin ID
                </label>

                <input
                    type="text"
                    id="login"
                    name="login"
                    placeholder="Enter your ID"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                Login
            </button>


            <p id="loginMessage"></p>

        </form>


        <div class="register-section">

            <p>
                Don't have an account?
            </p>

            <a
                href="register.php"
                class="register-link"
            >
                Create an Account
            </a>

        </div>

    </main>


    <script src="assets/js/login.js"></script>

</body>

</html>
